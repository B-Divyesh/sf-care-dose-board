<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="theme-color" content="#071319" />
    <title>Dose Witness — offline</title>
    <style>
      :root{color-scheme:dark;font-family:system-ui,sans-serif;background:#071319;color:#f8f5e9}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px}.card{max-width:34rem;border:2px solid #31515b;background:#0d2028;padding:32px;box-shadow:8px 8px 0 #15313b}h1{font-family:"Arial Narrow",sans-serif;text-transform:uppercase;letter-spacing:.04em}p{font-size:18px;line-height:1.55;color:#b7cad0}.button{min-height:48px;border:2px solid #45e6e1;background:#45e6e1;color:#071319;font-weight:800;padding:14px 20px;display:inline-block;text-decoration:none}.button:focus-visible{outline:3px solid #f8f5e9;outline-offset:4px}
    </style>
  </head>
  <body>
    <main class="card">
      <h1>The board is offline</h1>
      <p>If you have opened Dose Witness on this device before, go back and your saved board should still work. Otherwise, reconnect once so the private app shell can be saved.</p>
      <a class="button" href="/">Try again</a>
    </main>
  </body>
</html>
